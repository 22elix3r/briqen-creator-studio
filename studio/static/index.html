<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Creator Studio</title>
  <link rel="stylesheet" href="/static/studio.css">
  <script type="module" src="/static/studio.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Creator Studio home"><span class="brand-mark">C</span> Creator Studio</a>
    <div class="top-actions">
      <span class="environment"><i></i> Simulated AI provider</span>
      <span id="wallet" class="wallet" aria-label="Available credits"></span>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-heading">
        <span>Projects</span>
        <button class="icon" data-action="new" aria-label="New project">+</button>
      </div>
      <nav id="project-list" aria-label="Projects"></nav>
      <a class="api-link" href="/docs" target="_blank" rel="noreferrer">API reference ↗</a>
    </aside>
    <main id="workspace" aria-busy="true"></main>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
</body>
</html>
