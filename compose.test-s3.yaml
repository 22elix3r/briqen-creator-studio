x-s3: &s3
  STUDIO_MEDIA_BACKEND: s3
  STUDIO_S3_BUCKET: creator-studio-test
  STUDIO_S3_ENDPOINT: http://object-store:8333
  AWS_ACCESS_KEY_ID: demo-s3-fixture
  AWS_SECRET_ACCESS_KEY: demo-s3-fixture-secret
  AWS_REGION: us-east-1

services:
  object-store:
    image: chrislusf/seaweedfs@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    environment:
      AWS_ACCESS_KEY_ID: demo-s3-fixture
      AWS_SECRET_ACCESS_KEY: demo-s3-fixture-secret
      S3_BUCKET: creator-studio-test
    volumes:
      - test-object-data:/data

  s3-init:
    build: .
    image: ${STUDIO_DEMO_IMAGE:-creator-studio:demo}
    environment:
      <<: *s3
    depends_on: [object-store]
    command: python -m tests.wait_for_s3

  api:
    environment:
      <<: *s3
    depends_on:
      s3-init:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *s3
    depends_on:
      s3-init:
        condition: service_completed_successfully

volumes:
  test-object-data:
