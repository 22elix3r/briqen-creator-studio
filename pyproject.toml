[project]
name = "briqen-creator-studio"
version = "0.1.0"
description = "A replayable Creator Studio workflow with durable generation and export jobs"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "pillow>=12,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn>=0.38,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
